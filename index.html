<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ピアノ譜せん</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ピアノ譜せん">
<meta name="theme-color" content="#1d6fd6">
<style>
  :root { --accent:#1d6fd6; --accent-bg:#e3eefc; --warn-bg:#fff3b0; --line:#d5d5d5; --text:#222; --muted:#666; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif; color:var(--text); background:#fafafa; }
  body { display:flex; flex-direction:column; height:100dvh; overflow:hidden; padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }  /* ホーム画面起動時のノッチ・ホームバーを避ける */
  button { font: inherit; min-height:44px; min-width:44px; border:1px solid var(--line); background:#fff; border-radius:8px; padding:0 10px; color:var(--text); }
  button.on { background:var(--accent-bg); border-color:var(--accent); color:var(--accent); font-weight:600; }
  #topbar, #infobar { display:flex; align-items:center; gap:6px; padding:4px 6px; background:#fff; border-bottom:1px solid var(--line); flex-wrap:nowrap; }
  #infobar select { font:inherit; min-height:40px; border:1px solid var(--line); border-radius:8px; background:#fff; flex:none; }
  #scoreTitle { flex:1; text-align:center; font-weight:600; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #infoMeta { flex:1; min-width:0; color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer; }
  #playBpm { width:64px; flex:none; }
  #playBpmVal { font-size:12px; color:var(--muted); min-width:3.2em; flex:none; }
  .iconBtn { min-width:44px; padding:0; font-size:20px; }
  #scoreArea { flex:1; position:relative; display:flex; min-height:140px; }
  #scoreWrap { flex:1; overflow:auto; background:#fff; }
  #score svg { display:block; }
  #toolbar { background:#f3f3f3; border-top:1px solid var(--line); padding:4px; }
  .face { display:flex; gap:3px; align-items:center; flex-wrap:nowrap; overflow-x:auto; }
  .face[hidden] { display:none; }
  .faceTabs { display:flex; gap:2px; margin-bottom:4px; align-items:center; }
  .face button { min-width:38px; padding:0 4px; flex:none; }
  .faceTabs button { min-width:38px; padding:0 3px; flex:none; }
  .face button svg { width:22px; height:30px; display:block; fill:currentColor; stroke:currentColor; }
  .spacer { flex:1; }
  #keyboard { height:132px; background:#fff; border-top:1px solid var(--line); position:relative; overflow-x:auto; overflow-y:hidden; touch-action:pan-x; user-select:none; -webkit-user-select:none; }
  #btnBars { position:absolute; top:4px; right:8px; width:36px; height:36px; min-width:36px; min-height:36px; padding:0; border-radius:18px; background:rgba(255,255,255,.85); z-index:5; font-size:14px; }
  body.barsHidden #topbar, body.barsHidden #infobar { display:none; }
  @media (max-height: 520px) {
    #topbar, #infobar { padding:2px 6px; }
    button { min-height:36px; }
    .face button svg { height:24px; }
    #keyboard { height:84px; }
    #scoreArea { min-height:110px; }
  }
  #printArea { display:none; }
  #toast { position:fixed; left:50%; top:8px; transform:translateX(-50%); background:#c62828; color:#fff; padding:8px 14px; border-radius:8px; font-size:14px; display:none; z-index:50; }
  #toast.info { background:#333; }
  dialog { border:1px solid var(--line); border-radius:12px; padding:16px; width:min(92vw, 420px); font-size:15px; }
  dialog::backdrop { background:rgba(0,0,0,.35); }
  dialog h2 { margin:0 0 12px; font-size:17px; }
  dialog label { display:flex; align-items:center; gap:8px; margin:10px 0; }
  dialog input[type=text], dialog input[type=number], dialog select { flex:1; font:inherit; min-height:40px; padding:4px 8px; border:1px solid var(--line); border-radius:6px; }
  .dlgBtns { display:flex; justify-content:flex-end; gap:8px; margin-top:14px; }
  .listItem { display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--line); }
  .listItem .name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .listItem .date { color:var(--muted); font-size:12px; }
  .listItem.current .name { color:var(--accent); font-weight:600; }
  @media print {
    body > * { display:none !important; }
    #printArea { display:block !important; }
    @page { size: 210mm 297mm; margin: 0; }
    .print-page { width:210mm; height:297mm; padding:15mm; page-break-after:always; break-after:page; background:#fff; }
    .print-page:last-child { page-break-after:auto; break-after:auto; }
    .print-head { text-align:center; margin-bottom:6mm; }
    .print-head h1 { font-size:20pt; margin:0 0 2mm; font-weight:600; }
    .print-head .sub { font-size:10pt; color:#333; }
    .print-head .tempo { text-align:left; font-size:10pt; margin-top:3mm; }
    * { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
  }
</style>
</head>
<body>
  <div id="topbar">
    <button id="btnList" aria-label="曲一覧">☰ 曲一覧</button>
    <div id="scoreTitle">新しい曲</div>
    <button id="btnSettings" class="iconBtn" aria-label="曲の設定" title="曲の設定">⚙</button>
    <button id="btnPrint" class="iconBtn" aria-label="印刷" title="印刷">🖨</button>
  </div>
  <div id="infobar">
    <div id="infoMeta">4/4拍子 ・ ハ長調 ・ ♩=90</div>
    <select id="playHands" aria-label="鳴らす手"><option value="RL">両手</option><option value="R">右手</option><option value="L">左手</option></select>
    <input id="playBpm" type="range" min="30" max="240" step="1" aria-label="再生テンポ">
    <span id="playBpmVal">♩=90</span>
  </div>
  <div id="scoreArea"><div id="scoreWrap"><div id="score"></div></div><button id="btnBars" aria-label="上のメニューを隠す" title="上のメニューを隠す">︿</button></div>
  <div id="toolbar">
    <div class="faceTabs">
      <button id="btnFaceNotes" class="on">音符</button>
      <button id="btnFaceSigns">記号</button>
      <button id="btnPlay" class="iconBtn" aria-label="再生" title="再生">▶</button>
      <button id="btnStop" class="iconBtn" aria-label="停止" title="停止" hidden>■</button>
      <span class="spacer"></span>
      <button id="btnUndo" aria-label="戻す" title="戻す">↶</button>
      <button id="btnRedo" aria-label="やり直す" title="やり直す">↷</button>
      <button id="btnDelete" aria-label="消す" title="消す">⌫</button>
    </div>
    <div id="toolNotes" class="face"></div>
    <div id="toolSigns" class="face" hidden></div>
  </div>
  <div id="keyboard"></div>
  <div id="printArea"></div>
  <div id="toast"></div>
  <dialog id="dlgSettings">
    <form method="dialog">
      <h2>曲の設定</h2>
      <label>曲名 <input id="fTitle" type="text" maxlength="60" required></label>
      <label>作曲者 <input id="fComposer" type="text" maxlength="60"></label>
      <label>テンポ ♩= <input id="fBpm" type="number" min="30" max="240" step="1"></label>
      <label>拍子 <select id="fTimeSig"></select></label>
      <label>調 <select id="fKeySig"></select></label>
      <label><input id="fDoremiScreen" type="checkbox"> 画面にドレミを出す</label>
      <label><input id="fDoremiPrint" type="checkbox"> 印刷にドレミを出す</label>
      <div class="dlgBtns"><button id="btnSettingsCancel" type="button">キャンセル</button><button id="btnSettingsOk" value="ok">決定</button></div>
    </form>
  </dialog>
  <dialog id="dlgList">
    <h2>曲一覧</h2>
    <div id="listItems"></div>
    <div class="dlgBtns"><button id="btnNewScore">＋ 新しい曲</button><button id="btnListClose">閉じる</button></div>
  </dialog>
  <dialog id="dlgDynamic">
    <h2>強弱</h2>
    <div class="dlgBtns" style="flex-wrap:wrap; justify-content:center;">
      <button data-dyn="pp">pp</button><button data-dyn="p">p</button><button data-dyn="mp">mp</button>
      <button data-dyn="mf">mf</button><button data-dyn="f">f</button><button data-dyn="ff">ff</button>
    </div>
    <div class="dlgBtns"><button id="btnDynClear">消す</button><button id="btnDynCancel">キャンセル</button></div>
  </dialog>
  <dialog id="dlgRepeat">
    <h2>反復</h2>
    <div class="dlgBtns" style="flex-direction:column; align-items:stretch;">
      <button id="btnRepStart">この小節から繰り返し始め</button>
      <button id="btnRepEnd">この小節で繰り返し終わり</button>
      <button id="btnRepClear">この小節の反復記号を消す</button>
    </div>
    <div class="dlgBtns"><button id="btnRepCancel">キャンセル</button></div>
  </dialog>
  <script src="vendor/vexflow.js"></script>
  <script src="js/model.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/render.js"></script>
  <script src="js/playback.js"></script>
  <script src="js/edit.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
